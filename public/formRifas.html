    <form class=" formulario-rifa" id="formRifas">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Articulo a rifar:</label>
            <input type="text" class="form-control" id="articulo">
            <small id="errorArticulo" class="text-danger"></small>
        </div>
        <div class="input-group mb-3">
            <label class="input-group-text" for="inputGroupSelect01">Promovida por:</label>
                <select class="form-select" id="inputGroupSelect01">
                    <option selected>......</option>
                    <option>Sociedad de jovenes</option>
                    <option>Sociedad de embajadores</option>
                    <option>Sociedad de colaboradoras</option>
                </select>
        </div>
        <small id="errorPromotor" class="text-danger"></small>
        <div class="input-group mb-3">
            <span class="input-group-text">valor de la lista ($)</span>
            <input 
                type="number"
                class="form-control"
                id="valorlista"
                min="1"
                step="1"
                aria-label="Amount">
            <span class="input-group-text">.00</span>
        </div>
        <small id="errorValor" class="text-danger"></small>
        <div class="mb-3">
                <label for="fecha" class="form-label">Fecha:</label>
                <input type="date" class="form-control" id="fecha">
                <small id="errorFecha" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <label for="formFile" class="form-label">Imagen:</label>
            <input class="form-control" type="file" id="imagen" accept=".jpg,.jpeg,.png">
            <small id="errorImagen" class="text-danger"></small>
        </div>
        <button type="submit" class="btn btn-primary">Generar</button>
        <button type="button" class="btn btn-success d-none" id="btnPdf">Convertir a PDF</button>
    </form>

    <footer class="bg-dark text-white text-center p-3 mt-5">
