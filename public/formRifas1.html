<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Formulario de rifas</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
        <a class="navbar-brand" href="public/img/logo-web-azul-negro.png">
        <img src="img/logo-web-azul-negro.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
            <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">TE PUEDE INTERESAR</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="d-flex mt-3">
                <input class="form-control" type="search" placeholder="Filtro de busqueda" id="searchInput" aria-label="Search"/>
            </div>
            <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="pdf/Instructivo_pianoByOLSV.pdf">Piano PDF</a>
                </li>
                <li class="nav-item" id="itemRifa">
                <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#modalRifas">Creación de rifas</a>
                </li>
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Inicio</a>
                </li>
            </ul>
            <small id="sinResultados" class="text-danger"></small>
            </div>
        </div>
        </div>
    </nav>

    <form class=" formulario-rifa" id="formRifas">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Articulo a rifar:</label>
            <input type="text" class="form-control" id="articulo">
            <small id="errorArticulo" class="text-danger"></small>
        </div>
        <div class="input-group mb-3">
            <label class="input-group-text" for="inputGroupSelect01">Promovida por:</label>
                <select class="form-select" id="inputGroupSelect01">
                    <option selected>Selecciona una opción</option>
                    <option>sociedad de jovenes</option>
                    <option>sociedad de embajadores</option>
                    <option>sociedad de colaboradoras</option>
                    <option>escuela dominical</option>
                    <option>organización general</option>
                    <option>organización pastoral</option>
                    <option>directiva de pastores</option>
                    <option>directiva de musica</option>
                </select>
        </div>
        <small id="errorPromotor" class="text-danger"></small>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Lugar de la iglesia:</label>
            <input type="text" class="form-control" id="lugar">
            <small id="errorLugar" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">A beneficio de:</label>
            <input type="text" class="form-control" id="beneficio">
            <small id="errorBeneficio" class="text-danger"></small>
        </div>
        <div class="mb-3">
                <label for="fecha" class="form-label">Fecha:</label>
                <input type="date" class="form-control" id="fecha">
                <small id="errorFecha" class="text-danger"></small>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">valor de la lista ($)</span>
            <input type="number" class="form-control" id="valorlista" min="1" step="1" aria-label="Amount">
            <span class="input-group-text">.00</span>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">valor del numero ($)</span>
            <input type="number" class="form-control" id="valornumero" min="0.01" step="0.01" aria-label="Amount">
            <span class="input-group-text">0.00</span>
        </div>
        <small id="errorValorNumero" class="text-danger"></small>
        <div class="mb-3">
            <label for="formFile" class="form-label">Imagen:</label>
            <input class="form-control" type="file" id="imagen" accept=".jpg,.jpeg,.png">
            <small id="errorImagen" class="text-danger"></small>
        </div>
        <button type="submit" class="btn btn-primary">Generar</button>
        <button type="button" class="btn btn-success d-none" id="btnPdf">Convertir a PDF</button>
    </form>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p class="mb-0 small text-secondary">
            © 2026 Oscar Segura. Todos los derechos reservados.
        </p>
    </footer>

    <!-- Modal  -->
      <div class="modal fade" id="modalRifas" tabindex="-1">
      <div class="modal-dialog modal-lg">
          <div class="modal-content">

              <div class="modal-header">
                  <h5 class="modal-title">
                      Seleccione un diseño de rifa
                  </h5>

                  <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal">
                  </button>
              </div>

              <div class="modal-body">

                  <div class="row">

                      <div class="col-md-6 text-center">

                          <a href="formRifas.html">
                              <img
                                  src="img/Rifa1.png"
                                  class="img-fluid plantilla-rifa"
                                  alt="Diseño 1">
                          </a>

                          <h6 class="mt-2">
                              Diseño clásico
                          </h6>

                      </div>

                      <div class="col-md-6 text-center">

                          <a href="formRifas1.html">
                              <img
                                  src="img/Rifa2.png"
                                  class="img-fluid plantilla-rifa"
                                  alt="Diseño 2">
                          </a>

                          <h6 class="mt-2">
                              Diseño detallado
                          </h6>

                      </div>

                  </div>

              </div>

          </div>
      </div>
  </div>

    <script src="js/formRifas1.js"></script>
    <script src="js/buscador.js"></script>
</body>
</html>
