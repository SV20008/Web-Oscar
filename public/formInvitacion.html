<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Formulario de invitaciones</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top" id="menu"></nav>

    <form class="formulario-rifa" id="formInvitaciones">
        <div class="text-center mb-4">
            <img src="img/logo-web-azul-negro.png" width="80" class="logo-rifa">
            <h5 class="text-dark mt-3 titulo-rifa">CREACIÓN DE INVITACIONES</h5>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="iglesia" placeholder="Iglesia (ej. Santa Lucía)">
            <small id="errorIglesia" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <select class="form-select" id="tipoCulto">
                <option selected disabled>Tipo de culto unido</option>
                <option>Sociedad de Jóvenes</option>
                <option>Sociedad de Embajadores</option>
                <option>Sociedad de Colaboradoras</option>
                <option>Escuela Dominical</option>
                <option>Organización General</option>
                <option>Organización Pastoral</option>
                <option>Directiva de Pastores</option>
                <option>Directiva de Música</option>
            </select>
            <small id="errorTipoCulto" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <label for="fechaInvitacion" class="form-label">Fecha:</label>
            <input type="date" class="form-control" id="fechaInvitacion">
            <small id="errorFechaInvitacion" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <label for="horaInvitacion" class="form-label">Hora:</label>
            <input type="time" class="form-control" id="horaInvitacion">
            <small id="errorHoraInvitacion" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="lugarInvitacion" placeholder="Lugar">
            <small id="errorLugarInvitacion" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="nombrePastor" placeholder="Nombre del Pastor (nombre y apellido)">
            <small id="errorNombrePastor" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="nombrePresidente" placeholder="Nombre del Presidente (nombre y apellido)">
            <small id="errorNombrePresidente" class="text-danger"></small>
        </div>
        <button type="button" class="btn btn-primary" id="btnGenerarInvitacion">Generar</button>
    </form>

    <footer class="border-top mt-5" id="footer"></footer>

    <div class="modal fade" id="modalRifas" tabindex="-1"></div>

    <script src="js/componentes.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/formInvitacion.js"></script>
    <script src="js/buscador.js"></script>
</body>
</html>
