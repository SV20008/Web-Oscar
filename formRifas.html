            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="pdf/Instructivo_pianoByOLSV.pdf">Clases de piano</a>

            <form class="d-flex mt-3" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>

            </form>

    <form class=" formulario-rifa">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Articulo a rifar:</label>
            <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <select class="form-select" aria-label="Default select example">
            <option selected>Promovida por:</option>
            <option value="1">Sociedad de Embajadores</option>
            <option value="2">Sociedad de Jovenes</option>
            <option value="3">Sociedad de Colaboradoras</option>
            </select>
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">$</span>
            <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
            <span class="input-group-text">.00</span>
        </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha a rifar</label>
                <input type="date" class="form-control" id="fecha">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
